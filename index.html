<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 지도 화면 고정 나침반</title>
    <style>
        html,
        body,
        #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #compass-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        #compass-image {
            width: 60vh;
            height: 60vh;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            #compass-image {
                width: 75vw;
                height: 75vw;
                max-width: 350px;
            }

            #control-panel {
                top: 10px;
                left: 10px;
                padding: 8px;
                gap: 6px;
            }

            .btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }

        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover {
            background-color: #f0f0f0;
        }

        .btn.active {
            background-color: #4285F4;
            color: #fff;
            border-color: #4285F4;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="control-panel">
        <div class="control-group">
            <span style="font-size: 13px; font-weight: bold;">나침반:</span>
            <button id="btn-toggle" class="btn active" onclick="toggleCompass()">ON</button>
        </div>
    </div>

    <div id="compass-container">
        <img id="compass-image" src="./luopan_brown.png" alt="Compass">
    </div>

    <script>
        let isCompassVisible = true;
        let lastHeading = 0;
        let accumulatedRotation = 0;

        function startCompassMap() {
            try {
                const map = new google.maps.Map(document.getElementById("map"), {
                    center: { lat: 37.5665, lng: 126.9780 },
                    zoom: 16,
                    heading: 0,
                    tilt: 0,
                    mapId: "c4dd249fc63589dbebea6272"
                });

                const compassContainer = document.getElementById("compass-container");

                map.addListener("heading_changed", () => {
                    const currentHeading = map.getHeading() || 0;
                    let diff = currentHeading - lastHeading;

                    if (diff > 180) {
                        diff -= 360;
                    } else if (diff < -180) {
                        diff += 360;
                    }

                    accumulatedRotation += diff;
                    lastHeading = currentHeading;

                    compassContainer.style.transform = `rotate(${-accumulatedRotation}deg)`;
                });
            } catch (error) {
                console.error("지도를 초기화하는 중 오류 발생:", error);
            }
        }

        function toggleCompass() {
            const container = document.getElementById("compass-container");
            const btn = document.getElementById("btn-toggle");

            isCompassVisible = !isCompassVisible;

            if (isCompassVisible) {
                container.style.display = "flex";
                btn.innerText = "ON";
                btn.classList.add("active");
            } else {
                container.style.display = "none";
                btn.innerText = "OFF";
                btn.classList.remove("active");
            }
        }
    </script>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC65x514y9qD8MdeG4T7B4HDHkxx3W2xpI&callback=startCompassMap&loading=async"
        async defer></script>
</body>

</html>
